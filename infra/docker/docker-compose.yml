version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: crypto-news-bot-postgres
    restart: always
    environment:
      POSTGRES_DB: cryptobot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: crypto-news-bot-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../../apps/backend
      dockerfile: Dockerfile
    container_name: crypto-news-bot-backend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/cryptobot
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=production
    volumes:
      - ./logs:/app/logs

  frontend:
    build:
      context: ../../apps/frontend
      dockerfile: Dockerfile
    container_name: crypto-news-bot-frontend
    restart: always
    ports:
      - "3001:3001"
    depends_on:
      - backend
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:3000

volumes:
  postgres_data:
  redis_data: