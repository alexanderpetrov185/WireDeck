# Promtail конфигурация для отправки логов в Loki
# Собирает логи из файлов приложения и Docker контейнеров

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

# Конфигурация сканирования логов
scrape_configs:
  # Логи приложения (файлы)
  - job_name: application
    static_configs:
      - targets:
          - localhost
        labels:
          job: wiredeck
          __path__: /var/log/app/*.log
          host: backend
    pipeline_stages:
      - json:
          expressions:
            level: level
            message: message
            context: context
            timestamp: timestamp
      - labels:
          level:
          context:
      - timestamp:
          source: timestamp
          format: YYYY-MM-DD HH:mm:ss

  # Docker логи
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["com.docker.compose.project=docker"]
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'logstream'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'

  # Системные логи (journalctl)
  # - job_name: journal
  #   journal:
  #     max_age: 12h
  #     labels:
  #       job: systemd-journal
  #   relabel_configs:
  #     - source_labels: ['__journal__systemd_unit']
  #       target_label: 'unit'
