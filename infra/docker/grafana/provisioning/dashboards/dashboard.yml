# Grafana dashboards конфигурация
# Автоматически загружает дашборды из папки

apiVersion: 1

providers:
  # Дашборды по умолчанию
  - name: 'default'
    orgId: 1
    folder: ''
    folderUid: ''
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
