# Grafana datasource конфигурация
# Автоматически добавляет Prometheus как источник данных

apiVersion: 1

datasources:
  # Prometheus - основной источник метрик
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      httpMethod: POST
      timeInterval: 15s

  # Loki - источник логов
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: true
    jsonData:
      maxLines: 1000

  # Alertmanager - управление алертами (опционально)
  - name: Alertmanager
    type: alertmanager
    access: proxy
    url: http://prometheus:9090
    editable: true
    jsonData:
      implementation: prometheus
