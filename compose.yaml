# Docker Compose — основной стек приложения
# Запуск: docker compose up  (из корня проекта, где лежит этот файл)

name: wiredeck

services:
  # PostgreSQL - база данных для хранения новостей и пользователей
  postgres:
    image: postgres:15
    container_name: wiredeck-postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME in .env (see .env.example)}
      POSTGRES_USER: ${DB_USERNAME:?Set DB_USERNAME in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    # ports убраны: доступ к БД только внутри docker-сети (security hardening).
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis - кэш и очередь задач для BullMQ
  redis:
    image: redis:7-alpine
    container_name: wiredeck-redis
    restart: always
    # ports убраны: доступ к Redis только внутри docker-сети (security hardening).
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend - NestJS приложение
  backend:
    build:
      # Контекст сборки - корень проекта (здесь: code/), т.к. compose.yaml лежит в корне
      context: .
      # Путь к Dockerfile относительно контекста сборки
      dockerfile: apps/backend/Dockerfile
    container_name: wiredeck-backend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - NODE_ENV=production
      - RSS_FEEDS=${RSS_FEEDS}
      - INGESTION_TOKEN=${INGESTION_TOKEN}
      - AI_PROVIDER_URL=${AI_PROVIDER_URL}
      - AI_API_KEY=${AI_API_KEY}
      - AI_MODEL=${AI_MODEL}
      - TRANSLATION_PROVIDER_URL=${TRANSLATION_PROVIDER_URL}
      - TRANSLATION_API_KEY=${TRANSLATION_API_KEY}
      - TRANSLATION_MODEL=${TRANSLATION_MODEL}
      - TRANSLATION_TARGET_LANGUAGE=${TRANSLATION_TARGET_LANGUAGE}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHANNEL_ID=${TELEGRAM_CHANNEL_ID}
      - SCHEDULER_ENABLED=${SCHEDULER_ENABLED:-false}
      - PIPELINE_INTERVAL_MS=${PIPELINE_INTERVAL_MS:-600000}
      - PIPELINE_BATCH_LIMIT=${PIPELINE_BATCH_LIMIT:-10}
      - AI_RATE_LIMIT_RETRIES=${AI_RATE_LIMIT_RETRIES:-2}
      - AI_RATE_LIMIT_BASE_DELAY_MS=${AI_RATE_LIMIT_BASE_DELAY_MS:-2000}
      - PIPELINE_STATS_INTERVAL_MS=${PIPELINE_STATS_INTERVAL_MS:-15000}
      - PUBLISHING_STUCK_SWEEP_INTERVAL_MS=${PUBLISHING_STUCK_SWEEP_INTERVAL_MS:-600000}
      - PUBLISHING_STUCK_THRESHOLD_MS=${PUBLISHING_STUCK_THRESHOLD_MS:-3600000}
    volumes:
      - backend-logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Frontend - Next.js приложение
  frontend:
    build:
      # Контекст сборки - корень проекта (здесь: code/)
      context: .
      # Путь к Dockerfile относительно контекста сборки
      dockerfile: apps/frontend/Dockerfile
    container_name: wiredeck-frontend
    restart: always
    ports:
      - "3001:3001"
    depends_on:
      - backend
    environment:
      - NODE_ENV=production
      # Next.js standalone server.js читает PORT (по умолчанию 3000).
      # Явно задаем 3001, чтобы контейнер слушал порт, проброшенный наружу.
      - PORT=3001
      # Server-side BFF обращается к backend по имени сервиса в compose-сети.
      - BACKEND_API_URL=http://backend:3000
      # Токен только server-side (НЕ NEXT_PUBLIC_*), передается в backend
      # заголовком x-ingestion-token из Route Handlers.
      - INGESTION_TOKEN=${INGESTION_TOKEN}
      # Имя модератора для /moderation/* (server-side).
      - ADMIN_MODERATOR=${ADMIN_MODERATOR:-frontend-admin}
      # Пароль admin BFF (/api/admin/*). Без него админ-API закрыт (401).
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}

volumes:
  postgres_data:
  redis_data:
  backend-logs: