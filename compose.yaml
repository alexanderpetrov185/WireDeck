# Docker Compose — основной стек приложения
# Запуск: docker compose up  (из корня проекта, где лежит этот файл)

name: wiredeck

services:
  # PostgreSQL - база данных для хранения новостей и пользователей
  postgres:
    image: postgres:15
    container_name: wiredeck-postgres
    restart: always
    environment:
      POSTGRES_DB: wiredeck
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis - кэш и очередь задач для BullMQ
  redis:
    image: redis:7-alpine
    container_name: wiredeck-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend - NestJS приложение
  backend:
    build:
      # Контекст сборки - корень проекта (здесь: code/), т.к. compose.yaml лежит в корне
      context: .
      # Путь к Dockerfile относительно контекста сборки
      dockerfile: apps/backend/Dockerfile
    container_name: wiredeck-backend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=wiredeck
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - NODE_ENV=production
      - RSS_FEEDS=${RSS_FEEDS}
      - INGESTION_TOKEN=${INGESTION_TOKEN}
      - AI_PROVIDER_URL=${AI_PROVIDER_URL}
      - AI_API_KEY=${AI_API_KEY}
      - AI_MODEL=${AI_MODEL}
      - TRANSLATION_PROVIDER_URL=${TRANSLATION_PROVIDER_URL}
      - TRANSLATION_API_KEY=${TRANSLATION_API_KEY}
      - TRANSLATION_MODEL=${TRANSLATION_MODEL}
      - TRANSLATION_TARGET_LANGUAGE=${TRANSLATION_TARGET_LANGUAGE}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHANNEL_ID=${TELEGRAM_CHANNEL_ID}
      - SCHEDULER_ENABLED=${SCHEDULER_ENABLED:-false}
      - PIPELINE_INTERVAL_MS=${PIPELINE_INTERVAL_MS:-600000}
      - PIPELINE_BATCH_LIMIT=${PIPELINE_BATCH_LIMIT:-50}
    volumes:
      - backend-logs:/app/logs

  # Frontend - Next.js приложение
  frontend:
    build:
      # Контекст сборки - корень проекта (здесь: code/)
      context: .
      # Путь к Dockerfile относительно контекста сборки
      dockerfile: apps/frontend/Dockerfile
    container_name: wiredeck-frontend
    restart: always
    ports:
      - "3001:3001"
    depends_on:
      - backend
    environment:
      - NODE_ENV=production
      # Next.js standalone server.js читает PORT (по умолчанию 3000).
      # Явно задаем 3001, чтобы контейнер слушал порт, проброшенный наружу.
      - PORT=3001
      # Server-side BFF обращается к backend по имени сервиса в compose-сети.
      - BACKEND_API_URL=http://backend:3000
      # Токен только server-side (НЕ NEXT_PUBLIC_*), передается в backend
      # заголовком x-ingestion-token из Route Handlers.
      - INGESTION_TOKEN=${INGESTION_TOKEN}
      # Имя модератора для /moderation/* (server-side).
      - ADMIN_MODERATOR=${ADMIN_MODERATOR:-frontend-admin}

volumes:
  postgres_data:
  redis_data:
  backend-logs: